[project]
name = "ledgerlens-indexer"
version = "0.1.0"
description = "LedgerLens Python services: the bulk corpus indexer (spec 0005, D-42/D-43) and the claim-level groundedness judge (spec 0008, D-27/D-03)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Heavy ML stack (torch + transformers) — installed only on demand:
#   uv sync --extra local
# Parity with the Edge backend is verified by tests/test_embed_parity.py
# (cosine >= 0.999), which skips when this extra is absent.
local = [
  "sentence-transformers>=3,<6",
]

[project.scripts]
ledgerlens-index = "ledgerlens_indexer.cli:main"
ledgerlens-judge = "ledgerlens_judge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledgerlens_indexer", "ledgerlens_judge"]

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ledgerlens_indexer", "ledgerlens_judge"]
show_error_codes = true
