[project]
name = "ledgerlens-modal"
version = "0.1.0"
description = "Modal Whisper transcription for LedgerLens (spec 0009, D-42): audio -> timestamped transcript -> signed webhook into the same ingestion pipeline as invoices."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "modal>=0.68,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# faster-whisper is installed inside the Modal image at deploy time
# (see modal_transcription/app.py). This extra exists only for running the
# real model locally instead of the deterministic stub.
transcriber = [
  "faster-whisper>=1.0,<2",
]

[project.scripts]
ledgerlens-modal = "modal_transcription.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_transcription"]

[dependency-groups]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["modal_transcription"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["modal.*", "faster_whisper.*"]
ignore_missing_imports = true