name: CI

# Every job runs the same commands a developer runs — there is no CI-only
# script, so there is no "works locally, fails in CI".
#
#   check    pure logic: typecheck, lint, unit tests, deno check, doc proofs
#   e2e      the RLS proofs (D-23) against a real local Supabase stack
#   gitleaks secret scan (D-22)
#   knip     dead-code gate, zero tolerance (D-41)
#   python   both uv projects: the indexer/judge and the Modal app
#   infra    the Pulumi program, asserted with mocks — no credentials
#
# The eval gate lives in its own workflow (evals.yml). This file answers "is the
# code correct"; that one answers "what do the metrics read", and without a
# model key the honest answer is "nothing was measured", which exits non-zero.
# One badge each, so a red measurement is never read as a broken build.
#
# The first real run of this file failed in zero seconds — no jobs, no logs,
# "this run likely failed because of a workflow file issue" — while the YAML
# parsed cleanly and every job name was present. Two jobs carried
# `if: hashFiles('py/**') != ''` as a job-level condition, from when those
# directories did not exist yet; GitHub rejects the whole file for it, because
# nothing is checked out when a job-level condition is evaluated. Both
# directories exist now, so the guards were pointless as well as fatal.

on:
  push:
    branches: [main]
  pull_request:

# D-46: the supabase CLI's telemetry write can fail against a healthy stack;
# telemetry off keeps the CLI (and every `task` gate below) reliable in CI.
env:
  DO_NOT_TRACK: "1"

jobs:
  # Which jobs are worth paying for, computed once. The expensive ones — the
  # e2e suite and the python project — start a dev server or a Supabase stack,
  # so a documentation-only change should not pay for them. The list is a diff
  # of what actually moved, not a guess.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits of history, so a push to main can diff against its
          # parent instead of reporting the whole tree as changed.
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED="$(git diff --name-only "$BASE" HEAD || true)"
          CODE="$(printf '%s\n' "$CHANGED" | grep -E '^(src|tests|evals|supabase|scripts|.github)/|^Taskfile.yml|^playwright.config.ts' || true)"
          PY="$(printf '%s\n' "$CHANGED" | grep -E '^py/|^supabase/migrations/|^supabase/seed.sql' || true)"
          echo "code=$([ -n "$CODE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -n "$PY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "changed files: $CHANGED" | head -c 400
  check:
    name: typecheck, lint, unit tests, deno check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Deno is mandatory, not optional: `task deno-check` refuses to pass
      # without it (D-29), and so does this job.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      # `task check` now includes the browser-mode projects — component tests
      # and every Storybook story run as a test in real Chromium (spec 0006) —
      # so the browser has to be here, not only in the e2e job.
      - run: pnpm exec playwright install --with-deps chromium
      - run: task check

  e2e:
    name: end-to-end RLS proofs against the local stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The most expensive job in the file: a dev server plus the whole stack,
    # 175 tests on one worker. A documentation change does not deserve it, so
    # the job only starts when something it can fail on moved. Everything here
    # still runs for any code change, and on main it runs unconditionally.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      # Every job that runs a `task` target installs Task. The first real run
      # had two jobs die with `task: command not found` (exit 127) because only
      # the check job did — the whole point of "no CI-only script" is that CI
      # runs the same commands, which means it needs the same runner.
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Start the stack and apply migrations and seed
        run: |
          # Before `supabase start`, not after: config.toml's
          # [edge_runtime.secrets] resolve env(...) references when the
          # containers come up, and supabase/.env is gitignored. Without this
          # the Edge Functions boot with empty secrets and refuse every call
          # with 401 — which is exactly how the first real CI run failed, at
          # "Build the RAG index".
          cp supabase/.env.example supabase/.env
          supabase start
          supabase db reset --local
          ./scripts/write-env-local.sh
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # `task e2e` == `pnpm exec playwright test`; playwright.config.ts's
      # webServer starts the Next.js app itself (`pnpm dev`).
      - name: End-to-end suite
        run: task e2e
        env:
          CI: "true"

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  knip:
    name: dead-code gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails only on NEW findings: .knip-baseline.json (regenerated with
      # `pnpm exec knip --baseline`) holds the known dead exports; knip
      # reports the delta.
      - run: pnpm run knip

  python:
    name: python services
    runs-on: ubuntu-latest
    # The tests need a database (they run inside rolled-back transactions
    # against the real schema), so this job pays for a Supabase stack. Only
    # pay for it when a Python file, a migration, or the seeds moved.
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # The indexer's tests read the real schema and write inside transactions
      # that are always rolled back, so they need a database — the same one the
      # evals job uses, seeded the same way.
      - name: Start the stack and apply migrations and seed
        run: |
          # Before `supabase start`, not after: config.toml's
          # [edge_runtime.secrets] resolve env(...) references when the
          # containers come up, and supabase/.env is gitignored. Without this
          # the Edge Functions boot with empty secrets and refuse every call
          # with 401 — which is exactly how the first real CI run failed, at
          # "Build the RAG index".
          cp supabase/.env.example supabase/.env
          supabase start
          supabase db reset --local
          ./scripts/write-env-local.sh

      - name: Gate
        working-directory: py
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      # py/modal is its own uv project (Modal apps carry their own runtime), so
      # it gets its own gate rather than being folded into the one above.
      - name: Gate — Modal transcription
        working-directory: py/modal
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

  # The Pulumi program is asserted with pulumi.runtime.setMocks, so this job
  # needs no cloud credentials and no Pulumi Cloud token — which is the only
  # reason an infrastructure gate can run on every pull request in a project
  # that must cost nothing. `pulumi preview` against the real backend is a
  # human step, documented in infra/README.md.
  infra:
    name: infrastructure program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Gate
        working-directory: infra
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test