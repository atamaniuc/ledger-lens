name: Evals

# The measurement gate, in its own workflow on purpose.
#
# CI's other jobs answer "is the code correct". This one answers "what do the
# metrics read". Keeping it separate means the main badge reports the code and
# this badge reports the measurement.
#
# D-24 still holds where it can be acted on: with a provider key configured the
# run is strict and an unmeasured metric is a red build. With no key the
# model-dependent tier is reported as skipped, in the run output and in the job
# summary, and the job stays green — because a badge that has been red for
# months for one unfixable reason stops carrying information at all.
#
# The deterministic half needs no key and runs every time: recall@5 and
# abstention are measured here on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DO_NOT_TRACK: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not two commits: a shallow clone makes HEAD~1 a
          # mystery, and a change list that cannot be computed is skipped
          # wrongly. The repository is small; a full fetch costs seconds and
          # makes the diff the truth. The fail-open guard stays as a backstop.
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          RUN=true
          if git diff --quiet "$BASE" HEAD 2>/dev/null; then
            RUN=false
          elif CHANGED="$(git diff --name-only "$BASE" HEAD 2>/dev/null || true)"; then
            MATCH="$(printf '%s\n' "$CHANGED" | grep -E '^(src|tests|evals|supabase)/|^Taskfile.yml|^\.github/workflows/evals.yml' || true)"
            [ -z "$MATCH" ] && RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  evals:
    name: retrieval and agent-safety evals
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [changes]
    if: needs.changes.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: Start the stack and apply migrations and seed
        run: |
          # Before `supabase start`: config.toml's [edge_runtime.secrets]
          # resolve env(...) references when the containers come up, and
          # supabase/.env is gitignored. Without this the Edge Functions boot
          # with empty secrets and refuse every call with 401.
          cp supabase/.env.example supabase/.env
          # Deterministic start: an unclean Docker daemon surfaces as "address
          # already in use" on the database port (the stack's own retry cannot
          # fix it), so stop and remove leftovers first.
          supabase stop 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter name=supabase_) 2>/dev/null || true
          supabase start
          supabase db reset --local
          ./scripts/write-env-local.sh
      - name: Build the RAG index
        run: task index
      # The deterministic tier — recall@5 and abstention — needs no key and
      # gates every run: a breach is red here whatever else is configured.
      #
      # The model-dependent tier needs a provider key. With one configured this
      # runs strict, and an unmeasured metric is a red build (D-24). With none,
      # the run reports those metrics as skipped and the job stays green while
      # saying so in the summary.
      #
      # Why that changed: for months this workflow was red on every push for
      # one reason — no key in the repository. A permanently red badge that
      # means "not configured" is indistinguishable from one that means
      # "broken", and a signal nobody can act on is a signal everyone learns to
      # ignore. D-24's claim — a measurement that did not happen is not a
      # measurement that passed — is kept where it can still be acted on: in
      # the run's own output and in this job's summary, rather than in a badge
      # that has cried wolf since the day it was added.
      #
      # Any one of these secrets turns the model tier on. GROQ_API_KEY and
      # NVIDIA_API_KEY are free tiers, but a full run spends most of a free
      # tier's daily budget, which is why adding one is a deliberate choice
      # rather than the default (docs/RUNBOOK.md).
      - name: Evals
        id: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GROQ_API_KEY" ] || [ -n "$NVIDIA_API_KEY" ]; then
            echo "provider key present: measuring every metric, a skip is a failure"
            task evals
          else
            {
              echo "### Evals: model-dependent metrics NOT measured"
              echo
              echo "No provider key is configured in this repository, so tool choice,"
              echo "citation validity, injection resistance and groundedness did not run."
              echo "The deterministic metrics (recall@5, abstention) did, and gate this job."
              echo
              echo "Configure \`ANTHROPIC_API_KEY\`, \`GROQ_API_KEY\` or \`NVIDIA_API_KEY\`"
              echo "to measure the rest — see docs/RUNBOOK.md."
            } >> "$GITHUB_STEP_SUMMARY"
            task evals -- --allow-skip
          fi
