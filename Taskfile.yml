# LedgerLens — one entry point for everything local.
#   task          list every task
#   task up       clean-clone start: install, stack, seed, env, URL
#   task check    typecheck, lint, unit tests, deno check — nothing running
#   task verify   the full gate: check, then the live stack
# Docker is required for one thing: the Supabase stack, which `supabase start`
# owns; the app runs on this machine — ADR 0006. Debugger/typegen notes are in docs/RUNBOOK-NOTES.md.
version: "3"
silent: true

# D-46: supabase CLI telemetry writes can fail against a healthy stack; off keeps it reliable.
env:
  DO_NOT_TRACK: "1"

vars:
  DB_URL: '{{.DB_URL | default "postgresql://postgres:postgres@127.0.0.1:54322/postgres"}}'
  PROJECT_ID:
    sh: awk -F'"' '/^project_id/ { print $2 }' supabase/config.toml
tasks:
  default:
    desc: List every task, grouped
    cmds: [task --list]
  up:
    desc: "One command from a clean clone: install, stack, reset+seed, env, URL"
    deps: [docker-running, deno-present]
    cmds:
      - pnpm install
      - supabase start
      - supabase db reset
      - rm -f .env.local
      - ./scripts/write-env-local.sh
      - 'echo "app:    http://localhost:3000" && echo "studio: http://127.0.0.1:54323"'
  reset:
    desc: Rebuild the database — DROPS all local data, then re-seeds
    prompt: This drops every row in the local database and re-seeds. Continue?
    cmds: [supabase db reset]
  psql:
    desc: Open a psql shell on the local database
    interactive: true
    cmds: ['psql "{{.DB_URL}}"']
  logs:
    desc: "Tail a stack container's logs (SERVICE=db|auth|rest|edge_runtime|kong)"
    interactive: true
    cmds: ['docker logs -f supabase_{{.SERVICE | default "db"}}_{{.PROJECT_ID}}']
  dev:
    desc: "Next.js dev server on Node (Ctrl+C stops it). Debugger: docs/RUNBOOK-NOTES.md"
    deps: [stack-running, node-22]
    interactive: true
    cmds:
      - node --inspect=127.0.0.1:${DEBUG_PORT:-9230} node_modules/next/dist/bin/next dev
  check:
    desc: "Pure-logic gate: typecheck, lint, unit tests, deno check, doc proofs"
    cmds: ['task typecheck && task lint && task test && task deno-check && task docs-check']
  # Every claim in the human documentation names its evidence; this fails when
  # the evidence is gone. Pass --strict once README carries markers (spec 0012)
  # to also require that a claim-bearing document has evidence at all.
  docs-check:
    desc: "Check that every proof marker resolves, and that README carries evidence"
    cmds: ['pnpm exec tsx scripts/verify-docs.ts --strict {{.CLI_ARGS}}']
  typecheck:
    desc: TypeScript, app and tests
    cmds:
      - node_modules/next/dist/bin/next typegen
      - pnpm run typecheck
  lint:
    desc: ESLint
    cmds: [pnpm run lint]
  test:
    desc: Unit tests (Vitest)
    cmds: [pnpm run test]
  # supabase/functions/ is excluded from tsconfig and ESLint (Deno runtime) — this is its only gate (D-29).
  deno-check:
    desc: Type-check the Edge Functions (excluded from tsconfig)
    deps: [deno-present]
    cmds:
      - deno check --allow-import supabase/functions/provider-webhook/index.ts supabase/functions/embed/index.ts supabase/functions/transcribe-webhook/index.ts
  e2e:
    desc: "Playwright against the running app and database (task e2e -- tests/rls.spec.ts)"
    deps: [stack-running]
    cmds: ['pnpm exec playwright test {{.CLI_ARGS}}']
  # D-48: Bun used to load .env.local by itself; Node does not, so every script
  # entrypoint says so explicitly. --env-file-if-exists, because CI passes the
  # same variables as real environment variables and has no .env.local.
  # OTEL_SDK_DISABLED keeps the eval output readable: the runner is a
  # measurement tool whose answer is a score table, not the app's trace spans.
  evals:
    desc: "Score retrieval and agent safety against evals/dataset.jsonl (the CI gate)"
    deps: [stack-running]
    env: { OTEL_SDK_DISABLED: "1" }
    cmds: ['pnpm exec tsx --env-file-if-exists=.env.local evals/run.ts {{.CLI_ARGS}}']
  # Same reasoning as evals: a CLI's output is its own event log, not spans.
  index:
    desc: Rebuild the RAG index from documents and invoices (idempotent)
    deps: [stack-running]
    env: { OTEL_SDK_DISABLED: "1" }
    cmds: ['pnpm exec tsx --env-file-if-exists=.env.local scripts/index-corpus.ts {{.CLI_ARGS}}']
  # The Python path over the same corpus: batched embeddings and COPY instead of
  # eight texts per Edge Function call (spec 0005). --dry-run prints the plan.
  index-py:
    desc: "Rebuild the RAG index through the Python indexer (task index-py -- --dry-run)"
    deps: [stack-running]
    dir: py
    cmds: ['uv run ledgerlens-index {{.CLI_ARGS}}']
  # UV_CACHE_DIR is set because a sandboxed shell cannot always write to
  # ~/.cache/uv, and a gate that fails on the cache location tells you nothing
  # about the code.
  # Both Python projects: py/ (indexer + judge) and py/modal (the Modal app,
  # its own uv project because a Modal app carries its own runtime).
  check-py:
    desc: "Python gate: ruff, mypy, pytest — both uv projects"
    env: { UV_CACHE_DIR: ".uv-cache" }
    cmds:
      - 'cd py && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest'
      - 'cd py/modal && uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest'
  # Infrastructure (spec 0010). The gate needs no cloud credentials — the program
  # is asserted through pulumi.runtime.setMocks; preview and up need a real login.
  check-infra:
    desc: "Infra gate: typecheck and the mocked Pulumi tests (no credentials needed)"
    dir: infra
    cmds: ['pnpm install --frozen-lockfile && pnpm exec tsc --noEmit && pnpm test']
  # Credential-free: the real engine plans every resource against a throwaway
  # local backend, which is the half the mocked tests cannot cover.
  infra-plan:
    desc: "Plan the deploy program with no credentials (local backend, placeholder config)"
    cmds: ['./infra/scripts/plan.sh']
  infra-preview:
    desc: "Show what pulumi would change against the real stack (needs `pulumi login`)"
    dir: infra
    cmds: ['pulumi preview -s prod']
  infra-up:
    desc: "Stand up or update the deployable surface (needs `pulumi login`)"
    dir: infra
    prompt: This creates or changes real infrastructure. Continue?
    cmds: ['pulumi up -s prod']
  infra-destroy:
    desc: Tear the deployable surface down
    dir: infra
    prompt: This destroys the deployed stack. Continue?
    cmds: ['pulumi destroy -s prod']
  types:
    desc: Regenerate src/platform/supabase/database.types.ts from the local schema
    cmds: [./scripts/gen-types.sh]
  types-check:
    desc: Fail if database.types.ts is stale against the schema
    cmds: [./scripts/gen-types.sh --check]
  # evals belong here, not in check: they need the stack. Leaving them out is how
  # a runtime change broke them for a whole wave without a gate noticing (D-48).
  verify:
    desc: "The full gate: check, types-check, the end-to-end suite, then the evals"
    deps: [stack-running]
    cmds: ['task check && task types-check && task e2e && task evals']
  # The production image is a smoke check, not the deployed environment: Vercel
  # builds from source (decision 0006). It catches container-shaped mistakes —
  # a 127.0.0.1 that means the container, a file the build forgot to copy — and
  # it is the only thing that proves the production build works outside this
  # machine's toolchain. Deliberately not in CI: it costs minutes to prove
  # something Vercel does not use.
  docker-build:
    desc: "Build the production image (a smoke check on the production build)"
    deps: [docker-running]
    cmds: ['docker build -t ledgerlens:local .']
  clean:
    desc: Remove build output and test artifacts
    cmds: [rm -rf .next test-results playwright-report blob-report tsconfig.tsbuildinfo]
  node-22:
    internal: true
    preconditions:
      - sh: command -v node >/dev/null 2>&1
        msg: "Node is not installed — Next.js needs Node 22 or newer. https://nodejs.org"
      - sh: '[ "$(node -p "process.versions.node.split(\".\")[0]")" -ge 22 ]'
        msg: "Node 22 or newer is required (found $(node --version 2>/dev/null))."
  docker-running:
    internal: true
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is not running — start Docker Desktop and try again."
  stack-running:
    internal: true
    deps: [docker-running]
    preconditions:
      - sh: docker ps | grep -q 'supabase_db_'
        msg: "The local Supabase stack is not running — `task up` starts it."
      - sh: 'curl -sS -o /dev/null "$(sed -n "s/^SUPABASE_URL=//p" .env.local 2>/dev/null || printf "http://127.0.0.1:54321")/rest/v1/"'
        msg: "The local Supabase stack is not reachable — `task up` starts it."
      - sh: test -f .env.local
        msg: "No .env.local — `task up` writes one from the running stack."
  deno-present:
    internal: true
    preconditions:
      - sh: command -v deno >/dev/null 2>&1
        msg: "deno is not installed — supabase/functions/ would go unchecked. Install Deno: https://deno.land"