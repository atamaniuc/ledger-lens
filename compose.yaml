# LedgerLens in Docker, next to the Supabase stack the CLI already runs.
#
#   task dev-up          # the Supabase stack (creates the network below)
#   task docker-dev      # this app, hot reload + IDE debug, joined to it
#   task docker-up       # this app, the production build, joined to it
#
# The stack itself is deliberately absent from this file. `supabase start`
# owns those containers, their versions travel with supabase/config.toml, and
# a second definition here would be a copy that silently drifts from the one
# migrations and `db reset` are proven against — see ADR 0006.

name: ledgerlens

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ledgerlens-app:dev
    container_name: ledgerlens_dev
    volumes:
      # Source is live-mounted for hot reload. The two named volumes shadow
      # the container's own `node_modules` and `.next` so the host's (macOS)
      # bind mount never overwrites the Linux-built native deps (`sharp`,
      # `unrs-resolver`) the `dev` image stage already installed. Named, not
      # anonymous: `task typecheck`/`lint`/`test`/`build`/`start` each run as
      # a separate one-off `docker compose run --rm dev ...` — a named
      # volume is the same volume across those separate invocations, so
      # `task build`'s `.next` output is still there for `task start` to
      # read; an anonymous one would be recreated (and discarded) per run.
      # Trade-off, stated plainly: unlike an anonymous volume, a named one is
      # populated from the image only while it's empty — an image rebuild
      # (`--build`, on every task here) does NOT refresh an already-populated
      # volume. After `bun add`/a lockfile change, `task dev-volumes-reset`
      # is the actual remedy; `--build` alone is not.
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    ports:
      # Loopback only, same reasoning as `app` below — plus the debugger:
      # 0.0.0.0 without this prefix would put a code-execution-capable
      # inspector on the network the laptop happens to be on.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
      - "127.0.0.1:${DEBUG_PORT:-9230}:9230"
    env_file:
      - .env.local
    environment:
      SUPABASE_URL: http://kong:8000
    # Overrides package.json's own `dev` script — same command, but bound to
    # 0.0.0.0 for this container only. `bun run dev` would keep the script's
    # own `--inspect=127.0.0.1:...`, which binds the *container's* loopback —
    # unreachable through Docker's port-publish, which forwards to the
    # container's external interface. `NODE_OPTIONS` and `BUN_INSPECT` don't
    # work as an override here: Bun ignores `NODE_OPTIONS` (a Node
    # convention), and `BUN_INSPECT` gets inherited by both the `bun run`
    # wrapper process and the script it spawns, so both try to bind the same
    # port and the second one crashes with EADDRINUSE. The command below
    # runs `next` by its file path directly under `bun --inspect=...` — one
    # process, the flag actually applies, confirmed empirically.
    # The inspector's bind address is the fixed container-side port (9230),
    # not the `${DEBUG_PORT}` variable — that variable only ever changes the
    # *host*-side publish above. Binding the variable here was a real bug:
    # `DEBUG_PORT=9999` would publish 127.0.0.1:9999, forwarding to container
    # port 9230 (the `ports:` target never changes), while the inspector
    # itself listened on 9999 *inside* the container — nothing reachable on
    # either end. Same reasoning as `app`'s `PORT=3000` env var never moving.
    command: ["bun", "--inspect=0.0.0.0:9230", "node_modules/next/dist/bin/next", "dev"]
    networks:
      - supabase

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerlens-app:local
    container_name: ledgerlens_app
    restart: unless-stopped
    ports:
      # Loopback only. This process holds the service-role key, and the
      # default 0.0.0.0 bind would publish it to every device on the network
      # the laptop happens to be on.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Everything the app needs, from the same file the host processes read.
    # Required, not optional: without it the routes reject every request for
    # want of a service-role key, which would look like an app bug.
    env_file:
      - .env.local
    environment:
      # Inside the network the gateway is `kong`, not 127.0.0.1 — loopback in
      # a container is the container itself. Overrides .env.local's value,
      # which is written for processes running on the host.
      SUPABASE_URL: http://kong:8000
      NODE_ENV: production
    networks:
      - supabase

networks:
  # Created by `supabase start`. External, so `docker compose down` never
  # takes the database's network with it. The `t1` suffix is
  # supabase/config.toml's `project_id` — Taskfile.yml derives the same
  # value for its own container-name lookups (`PROJECT_ID`); if that file
  # ever changes, this line has to change with it, by hand.
  supabase:
    name: supabase_network_t1
    external: true

volumes:
  dev_node_modules:
  dev_next:
