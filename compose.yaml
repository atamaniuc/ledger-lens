# An optional container smoke check for the Next.js app.
#
#   task up                       # the Supabase stack (creates the network below)
#   docker compose up -d --build app  # this image, joined to it
#
# This is not the development loop. `task dev` runs the app on your machine,
# and so do every check and the Playwright suite — see ADR 0006. What this
# file is for is running the production build once inside Linux, where
# container-shaped mistakes show up: `127.0.0.1` meaning the container rather
# than the host is the one that keeps happening.
#
# It is also not a stand-in for production. Vercel builds and runs the
# deployed app from Next.js's own output; this image only proves the build
# works in a container, which is a smaller claim.
#
# The Supabase stack is deliberately absent. `supabase start` owns those
# containers, their versions travel with supabase/config.toml, and a second
# definition here would be a copy that silently drifts from the one
# migrations and `db reset` are proven against.

name: ledgerlens

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerlens-app:local
    container_name: ledgerlens_app
    restart: unless-stopped
    ports:
      # Loopback only. This process holds the service-role key, and the
      # default 0.0.0.0 bind would publish it to every device on the network
      # the laptop happens to be on.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Everything the app needs, from the same file the host processes read.
    # Required, not optional: without it the routes reject every request for
    # want of a service-role key, which would look like an app bug.
    env_file:
      - .env.local
    environment:
      # Inside the network the gateway is `kong`, not 127.0.0.1 — loopback in
      # a container is the container itself. Overrides .env.local's value,
      # which is written for processes running on this machine.
      SUPABASE_URL: http://kong:8000
      NODE_ENV: production
    networks:
      - supabase

networks:
  # Created by `supabase start`. External, so `docker compose down` never
  # takes the database's network with it. The `t1` suffix is
  # supabase/config.toml's `project_id` — Taskfile.yml derives the same
  # value for its own container-name lookups (`PROJECT_ID`); if that file
  # ever changes, this line has to change with it, by hand.
  supabase:
    name: supabase_network_t1
    external: true